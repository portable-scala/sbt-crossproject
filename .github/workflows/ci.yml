name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: [ '2.12.x', '3.x' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v8
      - name: Install Scala Native dependencies
        run: sudo apt-get install libgc-dev libunwind8-dev
      - name: scalafmt
        run: ./scripts/scalafmt --test
      - name: MiMa
        run: sbt ++${{ matrix.scala }} ";sbt-crossproject/mimaReportBinaryIssues;sbt-scalajs-crossproject/mimaReportBinaryIssues;sbt-scala-native-crossproject/mimaReportBinaryIssues"
      - name: Test
        run: sbt ++${{ matrix.scala }} sbt-crossproject-test/scripted
